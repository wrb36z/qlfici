
name: Actualisation matchs FC Plechatel

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser-matchs:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier le script de synchronisation
        run: |
          if [ ! -f scripts/update_matchs.py ]; then
            echo "Script scripts/update_matchs.py absent"
            exit 1
          fi

      - name: Actualiser les matchs
        run: python scripts/update_matchs.py

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchs.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique des matchs"
            git push
          fi
